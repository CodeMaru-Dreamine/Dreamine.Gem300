name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  build-test-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore tests/Dreamine.Gem300.Tests/Dreamine.Gem300.Tests.csproj
      - name: Install SonarScanner
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner --version 11.2.1
      - name: Begin SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        shell: pwsh
        run: dotnet sonarscanner begin /k:"CodeMaru-Dreamine_Dreamine.Gem300" /o:"codemaru-dreamine" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
      - name: Build
        run: dotnet build tests/Dreamine.Gem300.Tests/Dreamine.Gem300.Tests.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Test with coverage
        run: dotnet test tests/Dreamine.Gem300.Tests/Dreamine.Gem300.Tests.csproj --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage;Format=opencover" --results-directory TestResults
      - name: End SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        shell: pwsh
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
      - name: Pack
        run: dotnet pack Dreamine.Gem300.csproj --configuration Release --no-build --no-restore --output artifacts -p:ContinuousIntegrationBuild=true
      - name: Verify package consumption
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'artifacts/Dreamine.Gem300.1.0.1.nupkg'
          $symbols = Join-Path $PWD 'artifacts/Dreamine.Gem300.1.0.1.snupkg'
          if (!(Test-Path -LiteralPath $package) -or !(Test-Path -LiteralPath $symbols)) { throw 'Expected package artifacts were not produced.' }
          $smoke = Join-Path $env:RUNNER_TEMP 'consumer-smoke'
          dotnet new console --framework net8.0 --output $smoke --no-restore
          dotnet add $smoke package Dreamine.Gem300 --version 1.0.1 --no-restore
          dotnet restore $smoke --source (Join-Path $PWD 'artifacts') --source https://api.nuget.org/v3/index.json
          dotnet build $smoke --no-restore
      - name: Run package QuickStart
        shell: pwsh
        run: |
          $sample = 'samples/Dreamine.Gem300.QuickStart/Dreamine.Gem300.QuickStart.csproj'
          dotnet restore $sample --source (Join-Path $PWD 'artifacts') --source https://api.nuget.org/v3/index.json -p:DreamineSelfPackageVersion=1.0.1
          dotnet run --project $sample --configuration Release --no-restore -p:DreamineSelfPackageVersion=1.0.1
